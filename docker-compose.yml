version: '3.8'

services:
  learnsphere-marks:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: learnsphere_marks_app
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - ./data:/app/data
    restart: unless-stopped
